[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace2world-env"
version = "0.2.0"
description = "Host, client, evaluators, and feedback agent for the Trace2World browser environments"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pillow>=10.0.0",
  "playwright>=1.40.0",
  "pydantic>=2.10",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
t2w-serve = "trace2world_env.cli.serve:main"
t2w-smoke = "trace2world_env.cli.smoke:main"
t2w-rollout = "trace2world_env.cli.rollout:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trace2world_env.scoring" = ["checkpoint_harness.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
