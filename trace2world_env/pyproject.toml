[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace2world"
version = "0.1.0"
description = "Standalone hosting, evaluation, and agent code for the Trace2World browser environments"
requires-python = ">=3.12"
dependencies = [
  "click>=8.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "jinja2>=3.1",
  "pillow>=10.0.0",
  "playwright>=1.40.0",
  "pydantic>=2.10",
  "uvicorn[standard]>=0.30.0",
]

[project.scripts]
t2w-serve = "trace2world.env.__main__:main"
t2w-rollout = "trace2world.cli.run_task:main"
t2w-smoke = "trace2world.cli.smoke:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"trace2world.agent.prompts" = ["*.j2"]
